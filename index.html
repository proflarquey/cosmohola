<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>CosmoHola · iPhone · enseignant</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>:root{
  --ink:#16233F; --ink2:#4A5878; --paper:#F2F4F8; --card:#FFFFFF; --red:#C8102E; --red2:#8E0B20; --sky:#2F6FA3;
  --gold:#E3A008; --green:#2E8B57; --line:#D8DEE8; --kraft:#E9DFC9; --bad:#B3261E;
  --head:"Roboto Condensed","Arial Narrow",sans-serif-condensed,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,Roboto,"Segoe UI",Arial,sans-serif;
  --serif:Georgia,"Noto Serif","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));position:relative}
.airmail{height:8px;margin:0 -16px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 22px,var(--sky) 22px 36px,#fff 36px 44px)}
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.1} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--ink2)} small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.top button,.ghost{background:none;border:0;padding:8px 6px;font-weight:600;color:var(--ink2)}
.miles{font-family:var(--head);font-weight:700;color:var(--sky);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--sky);border-color:var(--sky);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 140px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}

/* ---------- couverture / profils ---------- */
.cover{background:var(--ink);color:#F4E7C2;border-radius:0 0 22px 22px;margin:0 -16px;padding:34px 22px 28px;text-align:center;position:relative}
.cover .logo{font-family:var(--head);font-size:46px;font-weight:700;letter-spacing:.02em;line-height:1}
.cover .logo span{color:var(--gold)}
.cover p{margin:8px 0 0;color:#C9CFDD}
.cover svg{width:86px;height:86px;margin:0 auto 10px;display:block}
.prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.prof .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.prof b{font-size:18px}.prof .grow{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}.pick button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:16px}
.pick button[aria-pressed=true]{border-color:var(--ink);background:#E9EEF7}
.pick.av button{font-size:28px;padding:4px 10px}
input[type=text]{width:100%;font:inherit;font-size:20px;-webkit-appearance:none;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.lab{display:block;font-weight:700;margin:14px 0 6px}

/* ---------- carte du voyage ---------- */
.hello{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.route{position:relative;margin:18px 0 10px;padding-left:46px}
.route:before{content:"";position:absolute;left:21px;top:10px;bottom:10px;width:6px;border-radius:3px;background:linear-gradient(var(--red) 0 52%,transparent 52% 58%,var(--gold) 58%)}
.sea{position:relative;margin:4px 0 4px -46px;padding:10px 0 10px 46px;color:var(--sky);font-family:var(--head);font-weight:700;font-size:15px}
.sea:before{content:"";position:absolute;left:21px;top:0;bottom:0;border-left:6px dotted var(--sky)}
.stop{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.stop:before{content:"";position:absolute;left:-33px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--red)}
.stop.us:before{border-color:var(--gold)}
.stop.me{border:2px solid var(--ink)}
.stop .thumb{width:96px;flex:none;border-radius:6px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.stop .thumb svg{display:block;width:100%;height:auto}
.stop .info{flex:1;min-width:0}
.stop .city{font-family:var(--head);font-size:21px;font-weight:700;line-height:1.1}
.stop .lvl{display:inline-block;font-weight:700;font-size:14px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px}
.bar{height:8px;background:#E6EAF1;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.nav{display:flex;gap:8px;margin-top:14px}.nav .btn{flex:1;font-size:15px;padding:10px 8px}

/* ---------- étape (niveau) ---------- */
.postcard{background:#fff;padding:10px 10px 12px;border-radius:6px;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(22,35,63,.10);transform:rotate(-1.2deg);margin:8px 6px 18px}
.postcard svg{display:block;width:100%;height:auto;border-radius:2px}
.postcard .cap{font-family:var(--serif);font-size:16px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.postcard .fact{font-family:var(--serif);font-size:15px;color:var(--ink2);margin:6px 0 0}
.line{position:relative;padding-left:58px;margin-top:6px}
.line:before{content:"";position:absolute;left:25px;top:20px;bottom:20px;width:6px;border-radius:3px;background:var(--red)}
.line.us:before{background:var(--gold)}
.mrow{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;min-height:64px}
.mrow .st{position:absolute;left:-56px;top:50%;margin-top:-26px}
.mrow.locked{opacity:.55}
.mrow .t{flex:1;font-weight:700;line-height:1.25}
.mrow .meta{display:block;font-weight:400;font-size:14px;color:var(--ink2)}
.tier{color:var(--gold);letter-spacing:1px;font-size:13px}
.sk{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--ink2);border-radius:5px;padding:0 5px;margin-right:4px;color:var(--ink2)}
.best{font-family:var(--head);font-weight:700;font-size:18px}

/* tampons */
.stamp{width:52px;height:52px;display:block}
.stamp text{font-family:var(--head);font-weight:700}

/* ---------- feuille de mission ---------- */
.veil{position:fixed;inset:0;background:rgba(22,35,63,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet .memo{background:#fff;border-left:5px solid var(--sky);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:15px}
.sheet .memo ul{margin:6px 0 0;padding-left:18px;columns:2;column-gap:18px}
.sheet .memo li{break-inside:avoid}

/* ---------- questions ---------- */
.qhead{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.qhead .prog{flex:1;height:10px;background:#E1E6EF;border-radius:5px;overflow:hidden}.qhead .prog i{display:block;height:100%;background:var(--sky);transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin:8px 0}
.prompt{font-weight:700;color:var(--ink2);margin:0 0 10px}
.story{font-family:var(--serif);font-size:18px;line-height:1.6;background:#FBF8F1;border-left:5px solid var(--gold);padding:10px 12px;border-radius:6px;margin:0 0 12px}
.qtext{font-size:23px;font-weight:600;margin:6px 0 12px;line-height:1.35}
.qtext.big{font-size:34px;text-align:center}
.qimg{display:flex;justify-content:center;margin:6px 0 12px}
.listen{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.say{border:2px solid var(--sky);background:#EAF2F9;color:var(--sky);border-radius:999px;padding:10px 18px;font-weight:700;font-size:18px}
.say.big{font-size:22px;padding:14px 26px}
.opts{display:grid;gap:10px}
.opts.imgs{grid-template-columns:repeat(2,1fr)}
.opt{position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:19px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px;min-height:56px}
.opts.imgs .opt{justify-content:center;min-height:110px;padding:10px}
.opt.num{justify-content:center;font-size:28px;font-family:var(--head)}
.opt.num .lbl{text-align:center}
.opts.nums{grid-template-columns:repeat(2,1fr)}
.opt .lbl{flex:1}
.opt .os{border:0;background:#EAF2F9;color:var(--sky);border-radius:8px;padding:6px 9px;font-size:16px;flex:none}
.opt.ok{border-color:var(--green);background:#E7F4EC}
.opt.no{border-color:var(--bad);background:#FBEAEA;opacity:.7}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font-size:22px}
.emo{font-size:58px;line-height:1}
.emo.sm{font-size:38px}
.sw{display:inline-block;width:76px;height:76px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.multi{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:150px;font-size:30px;line-height:1.1}
.scene{position:relative;width:120px;height:96px}
.scene .o{position:absolute;font-size:40px;line-height:1}
.hint{background:#FFF7E0;border:1px solid #F0D58A;border-radius:10px;padding:10px 12px;margin:12px 0 0;font-size:16px}
.feedback{margin:12px 0 0;font-weight:700;font-size:18px}
.feedback.good{color:var(--green)}.feedback.bad{color:var(--bad)}
.qfoot{display:flex;gap:10px;margin-top:12px}.qfoot .btn{flex:1}
.typein{display:flex;gap:8px}.typein input{flex:1}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tok{border:2px solid var(--ink2);background:#fff;border-radius:8px;padding:8px 11px;font-size:18px;font-weight:600}
.answerline{min-height:56px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answerline .tok{border-color:var(--sky);background:#EAF2F9}
.answerline .end{font-size:22px;font-weight:700;margin-left:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- résultats ---------- */
.result{text-align:center;padding:10px 0}
.score{font-family:var(--head);font-size:64px;font-weight:700;line-height:1}
.score small{font-size:26px;color:var(--ink2)}
.bigstamp{width:140px;height:140px;margin:6px auto;display:block}
.land{animation:land .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes land{0%{transform:scale(2.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.rev{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.rev .mk{font-size:20px;flex:none;width:26px;text-align:center}
.rev .body{flex:1;min-width:0}
.rev .yours{color:var(--bad)} .rev .sol{color:var(--green);font-weight:700}
.rev.err{border-color:#E9B3B0}
.rev .fixer{margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.land,.shake{animation:none}.qhead .prog i{transition:none}}
@media (max-width:380px){h1{font-size:26px}.cover .logo{font-size:38px}.stop .thumb{width:76px}.opts.imgs .opt{min-height:96px}.emo{font-size:48px}}
.hl{color:#C8102E}.model{background:#FBF8F1;border-left:5px solid var(--gold);border-radius:6px;padding:8px 12px;margin:0 0 12px;font-size:17px}.model small{color:var(--ink2);font-weight:700}.qtext.sent{font-size:20px}.typein.long{flex-direction:column}.typein textarea{width:100%;font:inherit;font-size:19px;padding:12px;border:2px solid var(--line);border-radius:10px;resize:vertical;-webkit-appearance:none}:root{--red:#C60B1E;--red2:#8E0B18;--gold:#F1A90A;--sky:#1F6E8C}
/* iPhone: safe areas, legible controls and comfortable touch targets. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{min-width:320px}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
input,textarea{font-size:16px!important;max-width:100%}
#app{min-height:100vh;min-height:100dvh;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.top button,.ghost,.pick button,.say,.tok,.prof,.stop,.mrow{min-height:44px}
.btn{min-height:48px;white-space:normal;text-align:center;line-height:1.25}
.qhead .ghost{min-width:44px}
.top{min-width:0}.top small{min-width:0;text-align:right}
.sheet{max-height:88vh;max-height:88dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .btn{width:100%}
.typein input{min-width:0}
.typein .btn{flex:none}
.rev .body,.opt .lbl{overflow-wrap:anywhere}
@media(max-width:430px){
 .cover{padding-top:24px}
 .opts.imgs[style*="repeat(3,1fr)"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .opts.imgs .opt{min-width:0;overflow-wrap:anywhere}
 .hello{align-items:flex-start}
 .nav{flex-wrap:wrap}.nav .btn{min-width:140px}
 .qhead small{font-size:12px}
}
@media(max-width:360px){.typein:not(.long){flex-wrap:wrap}.typein:not(.long) .btn{width:100%}.qcard{padding:14px 12px}.stop .thumb{width:70px}}
</style></head>

/* ---- l'heure ---- */
function timeWords(h,m){ // style britannique
  var nh = h%12+1, hw = numWord(h===0?12:h);
  if(m===0) return hw+" o'clock";
  if(m===30) return 'half past '+hw;
  if(m===15) return 'quarter past '+hw;
  if(m===45) return 'quarter to '+numWord(nh===0?12:nh);
  if(m<30) return numWord(m)+' past '+hw;
  return numWord(60-m)+' to '+numWord(nh===0?12:nh);
}
function timeGen(mins, mode){
  return function(){
    var h=R.int(1,12), m=R.pick(mins), w=timeWords(h,m);
    var cands = uniq([w, timeWords(h,(m+30)%60), timeWords(h%12+1,m), timeWords(h, m===15?45:m===45?15:(m+15)%60), timeWords((h+10)%12+1,m)]);
    var hint = m===0?"o'clock = heure pile.": m===30?'half past = et demie : on dit l’heure qui vient de passer.':
      m===15?'quarter past = et quart.': m===45?'quarter to = moins le quart : on dit l’heure qui arrive.':
      (m<30?'past = « après » : minutes après l’heure passée.':'to = « moins » : minutes avant l’heure qui arrive.');
    if(mode==='listen') return mcq({prompt:'Écoute et touche la bonne horloge.', say:"It's "+w+'.', opts:cands.slice(0,3).map(function(x,i){
        var hm = i===0?[h,m]:null; return {label:'',img:'clk:'+(hm?hm.join(':'):parseClock(x))};}), hint:hint, sol:"It's "+w+'.', key:'H'+h+':'+m});
    return mcq({prompt:'Quelle heure est-il ?', img:'clk:'+h+':'+m, opts:cands.slice(0,4).map(function(x){return "It's "+x+'.';}), hint:hint, key:'h'+h+':'+m});
  };
}
function parseClock(w){ // inverse de timeWords pour les distracteurs
  for(var h=1;h<=12;h++) for(var m=0;m<60;m+=5){ if(timeWords(h,m)===w) return h+':'+m; } return '12:0';
}

var mem={};

  set:function(o){ var s=JSON.stringify(o); mem.v=s; try{ window.localStorage.setItem(KEY,s); return true; }catch(e){ return false; } } };

var store=Store.get()||{profiles:[],current:null};
var saveWarningShown=false;
function save(){ if(!Store.set(store)&&!saveWarningShown){ saveWarningShown=true; toast('Sauvegarde impossible ici. Ouvre le site dans Safari et exporte régulièrement tes données.'); } }
function P(){ return store.profiles.filter(function(p){return p.id===store.current;})[0]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function $(id){ return document.getElementById(id); }
function lvl(id){ return LEVELS.filter(function(l){return l.id===id;})[0]; }
function best(p,m){ return (p.best&&p.best[m.id])||0; }
function unlocked(p,L,m){ return p.open||m.n===0||best(p,L.missions[m.n-1])>=PASS; }
function lit(p,L){ return L.missions.map(function(m){return best(p,m)>=PASS;}); }
function litCount(p,L){ return lit(p,L).filter(Boolean).length; }

/* ---------- voix ---------- */
var voices=[]; function loadVoices(){ try{ voices=window.speechSynthesis?speechSynthesis.getVoices():[]; }catch(e){} }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
var curLang='es-ES';
function speak(text, slow){
  var p=P(), lang=(p&&p.accent&&p.accent!=='auto')?p.accent:curLang, rate=slow?0.62:((p&&p.rate)||0.9);
  text=String(text).replace(/___/g,'…').replace(/’/g,"'");
  if(window.Android&&Android.speak){ try{ Android.speak(text,lang,rate); return; }catch(e){} }
  if(!window.speechSynthesis){ toast('La lecture à voix haute n’est pas disponible ici.'); return; }
  speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=rate;
  var v=voices.filter(function(x){return x.lang&&x.lang.replace('_','-')===lang;})[0]||voices.filter(function(x){return /^es/i.test(x.lang);})[0];
  if(v) u.voice=v; else if(voices.length) toast('Aucune voix espagnole installée sur cet appareil.');
  speechSynthesis.speak(u);
}

function unlockSpeech(){ document.removeEventListener('touchend',unlockSpeech,true); document.removeEventListener('click',unlockSpeech,true);
  try{ if(!window.Android&&window.speechSynthesis){ var u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); loadVoices(); } }catch(e){} }
document.addEventListener('touchend',unlockSpeech,true); document.addEventListener('click',unlockSpeech,true);
function hush(){ try{ if(window.Android&&Android.stopSpeaking) Android.stopSpeaking(); else if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }

  for(var i=0;i<12;i++){ var a=i*30*Math.PI/180; t+='<line x1="'+(50+38*Math.sin(a))+'" y1="'+(50-38*Math.cos(a))+'" x2="'+(50+43*Math.sin(a))+'" y2="'+(50-43*Math.cos(a))+'" stroke="#16233F" stroke-width="'+(i%3?2:4)+'"/>'; }
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#16233F" stroke-width="4"/>'+t+
    '<line x1="50" y1="50" x2="'+(50+24*Math.sin(ha*Math.PI/180))+'" y2="'+(50-24*Math.cos(ha*Math.PI/180))+'" stroke="#16233F" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="50" y1="50" x2="'+(50+36*Math.sin(ma*Math.PI/180))+'" y2="'+(50-36*Math.cos(ma*Math.PI/180))+'" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#16233F"/></svg>'; }
function scene(a,b,rel){ // a = sujet (emoji), b = repère (boîte ou sac)
  var T=function(x,y,sz){ return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" text-anchor="middle" dominant-baseline="central">'+a+'</text>'; };
  var box=function(x,w,open){ var o='<g>'; if(open) o+='<polygon points="'+x+',40 '+(x+w)+',40 '+(x+w-6)+',34 '+(x+6)+',34" fill="#6B4423"/>';
    o+='<rect x="'+x+'" y="40" width="'+w+'" height="30" fill="#B07A45" stroke="#6B4423" stroke-width="2"/><line x1="'+x+'" y1="55" x2="'+(x+w)+'" y2="55" stroke="#8A5A2E" stroke-width="1.5"/>';
    o+='<rect x="'+(x+3)+'" y="70" width="5" height="22" fill="#6B4423"/><rect x="'+(x+w-8)+'" y="70" width="5" height="22" fill="#6B4423"/></g>'; return o; };
  var front=function(x,w){ return '<rect x="'+x+'" y="44" width="'+w+'" height="26" fill="#B07A45" stroke="#6B4423" stroke-width="2"/><line x1="'+x+'" y1="55" x2="'+(x+w)+'" y2="55" stroke="#8A5A2E" stroke-width="1.5"/>'; };
  var o='';
  switch(rel){
    case 'in': o=box(32,56,true)+T(60,40,26)+front(32,56); break;
    case 'on': o=box(32,56)+T(60,22,30); break;
    case 'under': o=box(32,56)+T(60,82,20); break;
    case 'next to': o=box(14,50)+T(96,60,30); break;
    case 'behind': o=T(66,40,34)+box(32,56); break;
    case 'in front of': o=box(32,56)+T(60,76,34); break;
    case 'between': o=box(2,36)+T(60,60,26)+box(82,36); break;
  }
  return '<svg width="120" height="96" viewBox="0 0 120 96" aria-hidden="true">'+o+'</svg>'; }
function img(spec, small){
  if(!spec) return '';
  if(spec.indexOf('sw:')===0) return '<span class="sw" style="background:'+spec.slice(3)+'"></span>';
  if(spec.indexOf('clk:')===0){ var t=spec.slice(4).split(':'); return clockSVG(+t[0],+t[1],small?84:110); }
  if(spec.indexOf('prep:')===0){ var p=spec.slice(5).split(':'); return scene(p[0],p[1],p[2]); }
  if(spec.indexOf('multi:')===0){ var q=spec.slice(6).split(':'), s=''; for(var i=0;i<+q[1];i++) s+=q[0]; return '<span class="multi">'+s+'</span>'; }
  if(spec.indexOf('ec:')===0){ var r=spec.slice(3).split(':'), k=CLOTH_E[r[0]]||r[0], col=r[1];
    return '<svg width="86" height="86" viewBox="0 0 100 100" aria-hidden="true"><path d="'+CLOTH[k]+'" fill="'+col+'" stroke="#16233F" stroke-width="3" stroke-linejoin="round"/></svg>'; }
  return '<span class="emo'+(small?' sm':'')+'">'+spec+'</span>';
}
function stampSVG(m,score,cls){ var c=score>=20?'#E3A008':score>=GOLD?'#C8102E':score>=PASS?'#2F6FA3':'#B9C1CF', on=score>=PASS;
  var rot=((m.n*37)%17)-8;
  return '<svg class="'+(cls||'stamp')+'" viewBox="0 0 60 60" aria-hidden="true"><g transform="rotate('+rot+' 30 30)">'+
   '<circle cx="30" cy="30" r="26" fill="'+(on?'#fff':'#F2F4F8')+'" stroke="'+c+'" stroke-width="3" '+(on?'':'stroke-dasharray="4 4"')+'/>'+
   '<circle cx="30" cy="30" r="20" fill="none" stroke="'+c+'" stroke-width="1.4"/>'+
   '<text x="30" y="'+(on?'37':'36')+'" font-size="'+(on?20:17)+'" text-anchor="middle" fill="'+c+'">'+(m.n+1)+'</text>'+
   (score>=20?'<text x="30" y="17" font-size="9" text-anchor="middle" fill="'+c+'">★</text>':'')+'</g></svg>'; }

/* ---------- série ---------- */
function series(m,n){ var out=[], keys={}, tries=0, last=null;
  while(out.length<n&&tries<400){ tries++; var q=m.gen(); if(!q) continue;
    if(keys[q.key]&&tries<300) continue; if(q.key===last) continue; keys[q.key]=1; last=q.key; out.push(q); }
  return out; }
function startQuiz(L,m){ quiz={L:L,m:m,qs:series(m,NQ),i:0,res:[],tries:0,spoken:false,showHint:false,locked:false,picked:[],typed:'',built:[]}; go('quiz'); }
function sayBtns(q){ return '<div class="listen"><button class="say big" onclick="ET.say()">🔊 Écouter</button><button class="say" onclick="ET.say(1)" aria-label="Écouter lentement">🐢</button></div>'; }

  if(q.text) h+='<div class="qtext'+(q.big?' big':'')+'">'+esc(q.text)+(q.say&&q.quiet?' <button class="say" style="font-size:15px;padding:5px 11px;vertical-align:middle" onclick="ET.sayText(\''+ctx+'\')" aria-label="Écouter">🔊</button>':'')+'</div>';
  if(q.say&&!q.quiet&&!q.text) h+=sayBtns(q); else if(q.say&&!q.quiet) h+=sayBtns(q);
  return h; }
function optsHTML(q, st, ctx){ // st : {wrong:[idx], done:bool, chosen:idx}
  var imgs=q.opts.every(function(o){return o.img&&!o.label;}), nums=q.opts.every(function(o){return o.num;});
  if(q.tf) return '<div class="tfrow">'+q.opts.map(function(o,i){ return optBtn(q,o,i,st,ctx,true); }).join('')+'</div>';
  return '<div class="opts'+(imgs?' imgs':nums?' nums':'')+'">'+q.opts.map(function(o,i){ return optBtn(q,o,i,st,ctx); }).join('')+'</div>'; }
function optBtn(q,o,i,st,ctx,tfb){ var cls='opt'+(o.num?' num':''), dis=st.done;

  var inner=o.img&&!o.label?img(o.img):'<span class="lbl">'+esc(tfb?(o.label==='Vrai'?'👍 Vrai':'👎 Faux'):o.label)+'</span>';
  var sb=(q.optSay&&o.label&&!o.num)?'<span class="os" role="button" aria-label="Écouter" onclick="event.stopPropagation();ET.sayOpt(\''+ctx+'\','+i+')">🔊</span>':'';
  return '<button class="'+cls+'" '+(dis?'disabled':'')+' onclick="ET.choose(\''+ctx+'\','+i+')" aria-label="'+esc(o.label||o.cap||('Réponse '+(i+1)))+'">'+inner+sb+'</button>'; }

function quizHTML(){ var Q=quiz, q=Q.qs[Q.i], L=Q.L, m=Q.m; curLang=L.voice;
  var h='<div class="qhead"><button class="ghost" onclick="ET.quit()" aria-label="Quitter">✕</button><span class="prog"><i style="width:'+(Q.i/Q.qs.length*100)+'%"></i></span><small class="muted">'+(Q.i+1)+' / '+Q.qs.length+'</small></div>';
  h+='<div class="qcard" id="qcard">'+qBody(q,'q');

  if(Q.locked) h+='<button class="btn primary" id="nextbtn" onclick="ET.next()">'+(Q.i+1<Q.qs.length?'Question suivante':'Voir mon résultat')+'</button>';
  return h+'</div>'; }
function check(q,ans){ if(q.type==='choice') return ans===q.ans;
  if(q.type==='type'){ var a=norm(ans); return q.alts.some(function(x){return norm(x)===a;}); }
  return ans===q.toks.join(' '); }
function answerLabel(q,ans){ if(ans==null) return '—'; if(q.type==='choice'){ var o=q.opts[ans]; return o?(o.label||o.cap||'(image)'):'—'; } return ans; }
function grade(ans){ var Q=quiz, q=Q.qs[Q.i], ok=check(q,ans);
  if(ok){ var pts=Q.tries===0?2:1; Q.res.push({ok:true,pts:pts,given:ans,tries:Q.tries+1}); Q.locked=true; Q.good=true;
    Q.fb=(pts===2?'✓ Bravo !':'✓ C’est ça, bien rattrapé !')+(q.say&&!q.text?' On entendait : « '+esc(q.say)+' »':'');
    render(); setTimeout(function(){ var b=$('nextbtn'); if(b) b.scrollIntoView({block:'nearest',behavior:'smooth'}); },50); return; }
  if(Q.tries===0){ Q.tries=1; Q.showHint=true; if(q.type==='choice') Q.picked.push(ans); if(q.type==='order') Q.built=[];
    Q.fb='Pas tout à fait. Lis le coup de pouce et essaie encore.'; Q.good=false; render(); var c=$('qcard'); if(c){ c.classList.add('shake'); } return; }
  Q.res.push({ok:false,pts:0,given:ans,tries:2}); Q.locked=true; Q.good=false; if(q.type==='choice') Q.picked.push(ans);
  Q.fb='Pas cette fois. Tu pourras te corriger à la fin de la mission.'; render(); }
function nextQ(){ var Q=quiz; if(Q.i+1<Q.qs.length){ Q.i++; Q.tries=0; Q.spoken=false; Q.showHint=false; Q.locked=false; Q.picked=[]; Q.typed=''; Q.built=[]; Q.fb=null; Q.good=false; go('quiz'); } else finish(); }
function finish(){ var Q=quiz, p=P(), m=Q.m, L=Q.L; var sc=Q.res.reduce(function(s,r){return s+r.pts;},0);
  var before=best(p,m), wasLit=litCount(p,L); p.best=p.best||{}; if(sc>before) p.best[m.id]=sc;
  p.miles=(p.miles||0)+sc*5+(sc===20?20:0); p.plays=(p.plays||0)+1; save();
  Q.score=sc; Q.newStamp=before<PASS&&sc>=PASS; Q.complete=wasLit<20&&litCount(p,L)===20; Q.date=new Date();
  Q.fix={}; go('result'); }

function resultHTML(){ var Q=quiz, p=P(), L=Q.L, m=Q.m, sc=Q.score; curLang=L.voice;
  var msg= sc===20?'Parfait ! Tampon doré.':sc>=GOLD?'Excellent ! Tampon rouge.':sc>=PASS?'Mission réussie ! Tampon bleu.':'Encore un effort : il faut 15/20 pour obtenir le tampon.';
  var h='<div class="top"><button onclick="ET.go(\'level\',{lv:\''+L.id+'\'})">← '+L.city+'</button><span class="miles">✈ '+(p.miles||0)+' miles</span></div>';
  h+='<div class="result"><h2>'+esc(m.t)+'</h2>'+stampSVG(m,sc,'bigstamp'+(sc>=PASS?' land':''))+'<div class="score">'+sc+'<small> / 20</small></div><p style="margin:6px 0 0;font-weight:700">'+msg+'</p>';
  if(Q.complete) h+='<p class="panel" style="text-align:left"><b>La carte postale est complète !</b> Va la découvrir sur la page de l’étape : '+esc(L.title)+'.</p>';
  else if(Q.newStamp) h+='<p class="muted">Un nouveau morceau de la carte postale est dévoilé.</p>';
  h+='</div>';
  var errs=Q.res.filter(function(r){return !r.ok;}).length, fixed=Object.keys(Q.fix).filter(function(k){return Q.fix[k].done;}).length;
  if(errs) h+='<div class="panel"><b>'+(fixed>=errs?'Toutes tes erreurs sont corrigées. Bravo !':'Corrige tes erreurs pour progresser ('+(errs-fixed)+' restante'+(errs-fixed>1?'s':'')+').')+'</b><br><small class="muted">Chaque correction rapporte 1 mile. Le score de la mission ne change pas.</small></div>';
  Q.qs.forEach(function(q,i){ h+=revHTML(q,i); });
  var nx=L.missions[m.n+1];
  h+='<div class="row" style="margin-top:14px"><button class="btn" onclick="ET.start(\''+L.id+'\','+m.n+')">Rejouer (nouvelles questions)</button>'+(nx&&unlocked(p,L,nx)?'<button class="btn primary" onclick="ET.start(\''+L.id+'\','+nx.n+')">Mission suivante</button>':'')+'</div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn" onclick="ET.printBilan()">Imprimer le bilan</button></div>';
  return h; }
function qSummary(q,hide){ var s=''; if(q.story) s+='<small class="muted">'+esc(q.story.slice(0,90))+'…</small><br>';
  if(q.text) s+=esc(q.text); else if(q.type==='order') s+='Remettre dans l’ordre : '+esc(q.shuf.join(' / ')); else if(q.say) s+=hide?'🔊 (question à écouter)':'🔊 '+esc(q.say); else if(q.img) s+=img(q.img,true);
  if(q.img&&q.text) s=img(q.img,true)+' '+s; return s; }
function revHTML(q,i){ var Q=quiz, r=Q.res[i], f=Q.fix[i];
  if(r.ok) return '<div class="rev"><span class="mk">✓</span><div class="body">'+qSummary(q)+'<br><span class="sol">'+esc(q.sol)+'</span>'+(r.tries===2?' <small class="muted">(au 2e essai)</small>':'')+'</div></div>';
  var h='<div class="rev err" id="rev'+i+'"><span class="mk">'+(f&&f.done?'✓':'✗')+'</span><div class="body">';
  if(f&&f.done) return h+qSummary(q)+'<br><span class="sol">'+esc(q.sol)+'</span> <small class="muted">'+(f.shown?'(réponse vue)':'corrigé')+'</small></div></div>';
  h+='<small class="muted">Ta réponse : </small><span class="yours">'+esc(answerLabel(q,r.given))+'</span>';
  if(f&&f.open){ var ctx='r'+i; h+='<div class="fixer">'+qBody(q,ctx);
    if(q.type==='choice') h+=optsHTML(q,{wrong:f.wrong||[],done:false},ctx); else if(q.type==='type') h+=typeHTML(q,ctx,f.typed||''); else h+=orderHTML(q,ctx,f.built||[],false);
    h+='<div class="hint">💡 '+esc(q.hint)+'</div>'+(f.msg?'<div class="feedback bad">'+f.msg+'</div>':'')+'<div class="qfoot"><button class="btn" onclick="ET.showSol('+i+')">Voir la réponse</button></div></div>';
  } else h+='<br>'+qSummary(q,true)+'<div class="qfoot"><button class="btn blue" onclick="ET.openFix('+i+')">Me corriger</button></div>';
  return h+'</div></div>'; }
function fixDone(i,shown){ var Q=quiz; Q.fix[i]={done:true,shown:!!shown}; if(!shown){ var p=P(); p.miles=(p.miles||0)+1; save(); }
  render(); var left=Q.res.map(function(r,k){return !r.ok&&!(Q.fix[k]&&Q.fix[k].done)?k:-1;}).filter(function(k){return k>=0;});
  if(left.length){ toast((shown?'':'Corrigé ! ')+'Encore '+left.length+' erreur'+(left.length>1?'s':'')+' à corriger.'); var el=$('rev'+left[0]); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
  else { toast('Toutes les erreurs sont corrigées !'); window.scrollTo({top:0,behavior:'smooth'}); } }

function pImg(spec){ if(!spec) return ''; if(spec.indexOf('multi:')===0){ var q=spec.slice(6).split(':'),s=''; for(var i=0;i<+q[1];i++) s+=q[0]; return '<span class="mult">'+s+'</span>'; } return img(spec,true); }

  if(q.story) h+='<div class="story">'+esc(q.story)+'</div>';

  if(q.text) h+='<div class="t">'+esc(q.text)+'</div>'; else if(listen) h+='<div class="t">🔊 ('+k+')</div>';
  if(q.type==='choice') h+='<div>'+q.opts.map(function(o){ return '<span class="o"><span class="bx"></span>'+(o.img&&!o.label?pImg(o.img):esc(o.label))+'</span>'; }).join('')+'</div>';

/* ================= Cosmohola — VERSION ENSEIGNANT =================
   Chaque mission = 1. Leçon (observer, retenir) → 2. Entraînement formatif (10 questions, coups de pouce)
   → 3. Vérification (10 questions, sans aide, 7/10 pour valider et ouvrir la mission suivante). */
function prac(p,m){ return (p.prac&&p.prac[m.id]); }
function fmt(x){ return String(Math.round(x*10)/10).replace('.',','); }
function stampSVG(m,score,cls){ var c=score>=10?'#E3A008':score>=9?'#C8102E':score>=PASS?'#2F6FA3':'#B9C1CF', on=score>=PASS;
  var rot=((m.n*37)%17)-8;
  return '<svg class="'+(cls||'stamp')+'" viewBox="0 0 60 60" aria-hidden="true"><g transform="rotate('+rot+' 30 30)">'+
   '<circle cx="30" cy="30" r="26" fill="'+(on?'#fff':'#F2F4F8')+'" stroke="'+c+'" stroke-width="3" '+(on?'':'stroke-dasharray="4 4"')+'/>'+
   '<circle cx="30" cy="30" r="20" fill="none" stroke="'+c+'" stroke-width="1.4"/>'+
   '<text x="30" y="'+(on?'37':'36')+'" font-size="'+(on?20:17)+'" text-anchor="middle" fill="'+c+'">'+(m.n+1)+'</text>'+
   (score>=10?'<text x="30" y="17" font-size="9" text-anchor="middle" fill="'+c+'">★</text>':'')+'</g></svg>'; }
function render(){ var a=$('app'), h='';
  if(!P()&&view.name!=='profiles') view={name:'profiles'};
  switch(view.name){
    case 'profiles': h=profilesHTML(); break; case 'home': h=homeHTML(); break; case 'level': h=levelHTML(); break; case 'lesson': h=lessonHTML(); break;
    case 'quiz': h=quizHTML(); break; case 'result': h=resultHTML(); break; case 'passport': h=passportHTML(); break; case 'parents': h=parentsHTML(); break; }
  a.innerHTML='<div class="airmail"></div>'+h; after(); }

/* ---------- leçon (méthode : observer, puis retenir, puis s'exercer) ---------- */
function solved(q, paper){ var say=null, h='';
  if(q.story) return null;
  var lab=q.type==='choice'?(q.opts[q.ans].label||''):q.ans, oa=q.type==='choice'?q.opts[q.ans]:null;
  if(oa&&oa.img&&!oa.label){ var w=q.text||q.say||''; return {h:(paper?pImg(oa.img):img(oa.img,true))+' <b class="hl">'+esc(w)+'</b>', say:/[a-z]/i.test(w)?w:null}; }
  if(q.type==='choice'&&q.text&&q.text.indexOf('___')>=0){ var full=q.text.replace('___',lab); say=/[a-z]/i.test(full)&&!/[éèàù]/.test(full)?full:null;
    h=esc(q.text).replace('___','<b class="hl">'+esc(lab||'')+'</b>'); if(q.img) h=img(q.img,true)+' '+h; }
  else if(q.type==='choice'&&q.say&&!q.text){ var o=q.opts[q.ans]; say=q.say; h=(q.img?img(q.img,true)+' ':'')+' <b class="hl">'+esc(q.say)+'</b>'+(o.label&&!o.img?' → '+esc(o.label):''); }
  else if(q.type==='choice'){ h=(q.img?img(q.img,true)+' ':'')+(q.text?esc(q.text)+' → ':'')+'<b class="hl">'+esc(q.sol)+'</b>'; if(q.text&&/[a-z]/i.test(q.sol)&&!/[éèàù]/.test(q.sol)) say=q.sol; }
  else if(q.type==='type'){ h=(q.img?img(q.img,true)+' ':'')+(q.text?esc(q.text)+' → ':(q.say?'🔊 ':''))+'<b class="hl">'+esc(q.ans)+'</b>'; say=q.ans; }
  else { h='<b class="hl">'+esc(q.ans)+'</b>'; say=q.ans; }
  return {h:h,say:say}; }
function ruleOf(m){ if(m.sk==='C'||m.sk==='B') return []; var hs={}, out=[]; for(var i=0;i<40;i++){ var q=m.gen(); if(q&&q.hint&&!hs[q.hint]){ hs[q.hint]=1; out.push(q.hint); } } return out.slice(0,4); }
function lessonExamples(m){ var out=[], keys={}, t=0; while(out.length<5&&t<80){ t++; var q=m.gen(); if(!q||keys[q.key]) continue; keys[q.key]=1; var s=solved(q); if(s){ if(m.sk==='C') s.say=null; out.push(s); } } return out; }
function lessonHTML(){ var p=P(), L=lvl(view.lv), m=L.missions[view.n]; curLang=L.voice;
  if(!view.ex) view.ex=lessonExamples(m);
  var g=m.gen, pool=g&&g.pool;
  var h='<div class="top"><button onclick="ET.go(\'level\',{lv:\''+L.id+'\'})">← '+L.city+'</button><small class="muted">Mission '+(m.n+1)+' · Leçon</small></div><h1>'+esc(m.t)+'</h1>';
  if(m.sk==='B'){ h+='<div class="panel"><b>Ce bilan reprend toute l’étape.</b><ol style="margin:8px 0 0;padding-left:20px">'+L.missions.slice(0,19).map(function(x){return '<li>'+esc(x.t)+'</li>';}).join('')+'</ol></div>'; }
  else if(pool){ h+='<h2 style="margin:16px 0 6px">① Observe et écoute</h2><p class="muted" style="margin:0 0 8px">Touche une carte pour entendre le mot.</p><div class="opts imgs" style="grid-template-columns:repeat(3,1fr)">'+
      pool.map(function(x,i){ return '<button class="opt" style="flex-direction:column;min-height:120px;gap:4px" onclick="ET.sayWord('+i+')">'+(x.img?img(x.img,true):'')+'<b style="font-size:16px">'+esc(x.en)+'</b><small class="muted">'+esc(x.fr)+'</small></button>'; }).join('')+'</div>'; view.pool=pool; }
  if(m.sk!=='B'&&!pool){
    if(!pool) h+='<h2 style="margin:16px 0 6px">① Observe</h2>';
    h+='<div class="panel" style="margin-top:0">'+view.ex.map(function(e,i){ return '<p style="margin:6px 0;font-size:18px">'+e.h+(e.say?' <button class="say" style="font-size:14px;padding:3px 9px" onclick="ET.sayEx('+i+')" aria-label="Écouter">🔊</button>':'')+'</p>'; }).join('')+'</div>'; }
  var rl=pool?[]:ruleOf(m); if(rl.length){ h+='<h2 style="margin:16px 0 6px">② Retiens</h2><div class="memo" style="background:#fff;border-left:5px solid var(--sky);border-radius:8px;padding:12px 14px;font-size:17px">'+rl.map(esc).join('<br><br>')+'</div>'; }
  if(m.sk==='C') h+='<p class="muted">Dans les missions de culture, chaque coup de pouce de l’entraînement donne une explication.</p>';
  h+='<div class="row" style="margin-top:16px"><button class="btn" onclick="ET.newEx()">Autres exemples</button><button class="btn blue" onclick="ET.start(\''+L.id+'\','+m.n+',\'prac\')">'+(pool?'②':'③')+' Je m’entraîne</button></div>';
  return h; }

/* ---------- entraînement / vérification ---------- */
function quizHTML(){ var Q=quiz, q=Q.qs[Q.i], L=Q.L, m=Q.m, ck=Q.mode==='check'; curLang=L.voice;
  var h='<div class="qhead"><button class="ghost" onclick="ET.quit()" aria-label="Quitter">✕</button><span class="prog"><i style="width:'+(Q.i/Q.qs.length*100)+'%;'+(ck?'background:var(--red)':'')+'"></i></span><small class="muted">'+(ck?'Vérification':'Entraînement')+' · '+(Q.i+1)+'/'+Q.qs.length+'</small></div>';
  h+='<div class="qcard" id="qcard">'+qBody(q,'q');
  var st={wrong:ck?[]:Q.picked,done:Q.locked,good:Q.good};
  if(q.type==='choice') h+=optsHTML(q,st,'q'); else if(q.type==='type') h+=typeHTML(q,'q',Q.typed,Q.locked); else h+=orderHTML(q,'q',Q.built,Q.locked);
  if(!ck&&Q.showHint) h+='<div class="hint">💡 '+esc(q.hint)+'</div>';
  if(!ck&&Q.fb) h+='<div class="feedback '+(Q.good?'good':'bad')+'">'+Q.fb+'</div>';
  h+='</div><div class="qfoot">';
  if(ck) h+='<small class="muted" style="flex:1;text-align:center">Pas de coup de pouce pendant la vérification : une seule réponse par question.</small>';
  else { if(!Q.locked&&!Q.showHint) h+='<button class="btn" onclick="ET.hint()">💡 Coup de pouce</button>';
    if(Q.locked) h+='<button class="btn primary" id="nextbtn" onclick="ET.next()">'+(Q.i+1<Q.qs.length?'Question suivante':'Voir mon résultat')+'</button>'; }
  return h+'</div>'; }
function gradeBase(ans){ var Q=quiz, q=Q.qs[Q.i], ok=check(q,ans);
  if(Q.mode==='check'){ Q.res.push({ok:ok,pts:ok?1:0,given:ans,tries:1}); Q.locked=true; nextQ(); return; }
  if(ok){ var pts=Q.tries===0?1:0.5; Q.res.push({ok:true,pts:pts,given:ans,tries:Q.tries+1}); Q.locked=true; Q.good=true;
    Q.fb=(pts===1?'✓ Bravo !':'✓ C’est ça, bien rattrapé !')+accNote(q,ans)+(q.say&&!q.text?' On entendait : « '+esc(q.say)+' »':'');
    render(); setTimeout(function(){ var b=$('nextbtn'); if(b) b.scrollIntoView({block:'nearest',behavior:'smooth'}); },50); return; }
  if(Q.tries===0){ Q.tries=1; Q.showHint=true; if(q.type==='choice') Q.picked.push(ans); if(q.type==='order') Q.built=[];
    Q.fb='Pas tout à fait. Lis le coup de pouce et essaie encore.'; Q.good=false; render(); var c=$('qcard'); if(c) c.classList.add('shake'); return; }
  Q.res.push({ok:false,pts:0,given:ans,tries:2}); Q.locked=true; Q.good=false; if(q.type==='choice') Q.picked.push(ans);
  Q.fb='Pas cette fois. Tu pourras te corriger à la fin.'; render(); }
function finish(){ var Q=quiz, p=P(), m=Q.m, L=Q.L; var sc=Q.res.reduce(function(s,r){return s+r.pts;},0);
  Q.date=new Date(); Q.score=sc; Q.fix={};
  p.log=(p.log||[]); p.log.push({m:m.id,mode:Q.mode,s:sc,d:Q.date.toISOString().slice(0,10)}); if(p.log.length>400) p.log=p.log.slice(-400);
  if(Q.mode==='prac'){ if(p.need) delete p.need[m.id]; p.prac=p.prac||{}; if(p.prac[m.id]==null||sc>p.prac[m.id]) p.prac[m.id]=sc; p.miles=(p.miles||0)+Math.round(sc*3); save(); go('result'); return; }
  var before=best(p,m), wasLit=litCount(p,L); p.best=p.best||{}; if(sc>before) p.best[m.id]=sc;
  p.need=p.need||{}; if(sc<PASS) p.need[m.id]=1; else delete p.need[m.id];
  p.miles=(p.miles||0)+sc*10+(sc===10?20:0); save();
  Q.newStamp=before<PASS&&sc>=PASS; Q.complete=wasLit<20&&litCount(p,L)===20; go('result'); }
function resultHTML(){ var Q=quiz, p=P(), L=Q.L, m=Q.m, sc=Q.score, ck=Q.mode==='check'; curLang=L.voice;
  var h='<div class="top"><button onclick="ET.go(\'level\',{lv:\''+L.id+'\'})">← '+L.city+'</button><span class="miles">✈ '+(p.miles||0)+' miles</span></div>';
  if(ck){ var msg= sc===10?'Parfait ! Mission validée, tampon doré.':sc>=9?'Excellent ! Mission validée, tampon rouge.':sc>=PASS?'Mission validée ! Tampon bleu.':'Pas encore validée : il faut 7/10. Passe par un nouvel entraînement : la vérification se rouvrira ensuite.';
    h+='<div class="result"><h2>'+esc(m.t)+' · vérification</h2>'+stampSVG(m,sc,'bigstamp'+(sc>=PASS?' land':''))+'<div class="score">'+fmt(sc)+'<small> / 10</small></div><p style="margin:6px 0 0;font-weight:700">'+msg+'</p>';
    if(Q.complete) h+='<p class="panel" style="text-align:left"><b>La carte postale est complète !</b> '+esc(L.title)+'.</p>'; else if(Q.newStamp) h+='<p class="muted">Un nouveau morceau de la carte postale est dévoilé.</p>';
    h+='</div>'; }
  else h+='<div class="result"><h2>'+esc(m.t)+' · entraînement</h2><div class="score">'+fmt(sc)+'<small> / 10</small></div><p style="margin:6px 0 0;font-weight:700">'+(sc>=8?'Très bien : tu es prêt pour la vérification !':sc>=6?'C’est en bonne voie. Corrige tes erreurs, puis passe à la vérification ou refais un entraînement.':'Corrige tes erreurs et refais un entraînement avant la vérification.')+'</p><p class="muted" style="margin:4px 0 0">'+(writeOn(L)?'1 point pour une réponse juste écrite du premier coup, ½ point avec les propositions.':'1 point juste du premier coup, ½ point au 2e essai.')+'</p></div>';
  var errs=Q.res.filter(function(r){return !r.ok;}).length, fixed=Object.keys(Q.fix).filter(function(k){return Q.fix[k].done;}).length;
  if(errs) h+='<div class="panel"><b>'+(fixed>=errs?'Toutes tes erreurs sont corrigées. Bravo !':'Corrige tes erreurs pour progresser ('+(errs-fixed)+' restante'+(errs-fixed>1?'s':'')+').')+'</b><br><small class="muted">La note ne change pas, mais chaque correction aide à retenir.</small></div>';
  Q.qs.forEach(function(q,i){ h+=revHTML(q,i); });
  var nx=L.missions[m.n+1];
  h+='<div class="row" style="margin-top:14px"><button class="btn" onclick="ET.start(\''+L.id+'\','+m.n+',\'prac\')">'+(ck?(sc<PASS?'Nouvel entraînement (obligatoire)':'Nouvel entraînement'):'Refaire un entraînement')+'</button>'+
    (ck&&sc<PASS?'':'<button class="btn '+(ck&&sc>=PASS?'':'primary')+'" onclick="ET.start(\''+L.id+'\','+m.n+',\'check\')">'+(ck?'Retenter la vérification':'Passer à la vérification')+'</button>')+'</div>'+(ck&&sc<PASS?'<p class="muted" style="text-align:center">Pour retenter la vérification, il faut d’abord refaire un entraînement.</p>':'');
  if(ck&&sc>=PASS&&nx&&unlocked(p,L,nx)) h+='<div class="row" style="margin-top:10px"><button class="btn primary" onclick="ET.closeSheet();ET.lesson(\''+L.id+'\','+nx.n+')">Mission suivante : '+esc(nx.t)+'</button></div>';
  h+='<div class="row" style="margin-top:10px"><button class="btn" onclick="ET.printBilan()">Imprimer le bilan</button></div>';
  return h; }

  var h='<div class="top"><button onclick="ET.go(\'home\')">← Carte</button></div><h1>Espace enseignant</h1>';
  if(!gateOK){ gateQ=gateQ||[6+Math.floor(Math.random()*4),6+Math.floor(Math.random()*4)];
    return h+'<div class="panel"><p>Pour entrer, réponds à ce calcul :</p><p class="qtext big">'+gateQ[0]+' × '+gateQ[1]+' = ?</p><div class="typein"><input type="text" id="gate" inputmode="numeric" autocomplete="off" onkeydown="if(event.key===\'Enter\')ET.gate()" aria-label="Résultat"><button class="btn primary" onclick="ET.gate()">Entrer</button></div></div>'; }
  var classes=uniq(store.profiles.map(function(x){return x.cls||'';}));
  h+='<div class="panel"><h3>Bilans de classe</h3><p class="muted" style="margin:4px 0 8px">Tableau élèves × missions (meilleure note de vérification sur 10), une ligne par élève.</p>';

/* ================= Cosmotalk enseignant — écriture progressive =================
   6e : groupes de mots (2 à 4 mots) · 5e : phrases courtes · 4e : phrases complexes · 3e : phrases longues.
   Chaque exercice montre un MODÈLE résolu (« Exemple : … → … »), puis l'élève écrit.

/* ---------- comparaison tolérante : contractions, virgules, majuscules ---------- */
var PRON_S=/\b(he|she|it|that|there|what|who|where|here)'s\b/g;
function canon(s,sHas){ s=deacc(String(s==null?'':s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"«»¿¡]/g,'').replace(/[.!?]+\s*$/,'').replace(/[,;]/g,' ').replace(/\s+/g,' ').trim());
  s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not').replace(/n't\b/g,' not')
     .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would')
     .replace(PRON_S, sHas?'$1 has':'$1 is');
  return s.replace(/\s+/g,' ').trim(); }
function check(q,ans){ if(q.type==='choice') return ans===q.ans;
  if(q.type==='type'){ var a1=canon(ans), a2=canon(ans,true); return q.alts.some(function(x){ var c=canon(x), c2=canon(x,true); return c===a1||c===a2||c2===a1||c2===a2; }); }
  return ans===q.toks.join(' '); }

/* ---------- constructeur ---------- */
function W(o){ var okSet=[o.ans].concat(o.alts||[]).map(function(x){return canon(x);});
  var bad=uniq((o.bad||[]).filter(function(x){return okSet.indexOf(canon(x))<0;})).slice(0,2);
  if(bad.length<2){ var t=o.ans.replace(/[.!?]$/,'').split(' '), end=/[.!?]$/.test(o.ans)?o.ans.slice(-1):'';
    var cands=[]; if(t.length>2){ var c1=t.slice(); c1.splice(1,1); cands.push(c1.join(' ')+end); var c2=t.slice(); var x=c2[1]; c2[1]=c2[2]; c2[2]=x; cands.push(c2.join(' ')+end); var c3=t.slice(); c3.splice(t.length-1,1); cands.push(c3.join(' ')+end); }
    else if(t.length===2){ cands.push(t[1]+' '+t[0]+end, t[0]+end); }
    cands.forEach(function(c){ if(bad.length<2&&okSet.indexOf(canon(c))<0&&bad.indexOf(c)<0) bad.push(c.charAt(0).toUpperCase()+c.slice(1)); }); }
  var back=mcq({prompt:o.prompt, text:o.text, opts:[o.ans].concat(bad), hint:o.hint, key:'B'+o.key});
  return {type:'type', written:true, sent:true, prompt:o.prompt, model:o.model, text:o.text, ans:o.ans, alts:[o.ans].concat(o.alts||[]), hint:o.hint, sol:o.ans, key:'W'+o.key, back:back, story:o.story}; }
function lowS(s){ return /^(He|She|We|They|You|It)$/.test(s)?s.toLowerCase():s.replace(/^My\b/,'my'); }
function twice(gen){ return function(){ var a=gen(), b=gen(), k=0; while(b.key===a.key&&k++<10) b=gen(); a.model='Exemple : '+b.text.replace(/ → …$/,'')+' → '+b.ans; return a; }; }

var WRITE_N={'6e':2,'5e':3,'4e':3,'3e':4};

/* ---------- quels exercices d'écriture pour quelle mission ---------- */
function writeGens(L,m){ var list=WRITE_MAP[L.id]; if(!list) return []; for(var i=0;i<list.length;i++) if(list[i][0].test(m.t)) return list[i][1]; return []; }
function practiceSeries(L,m){ var qs=series(m,NQ); if(!writeOn(L)) return qs; qs=qs.map(toWritten);
  var g=writeGens(L,m); if(!g.length) return qs; var n=WRITE_N[L.id], keys={};
  var w=[]; var t=0; while(w.length<n&&t<40){ t++; var q=R.pick(g)(); if(keys[q.key]) continue; keys[q.key]=1; w.push(q); }
  // les productions écrites remplacent les dernières questions : du plus guidé au plus libre
  return qs.slice(0,NQ-w.length).concat(w); }
function startQuiz(L,m,mode){ mode=mode||'prac'; var qs=mode==='prac'?practiceSeries(L,m):series(m,NQ);
  quiz={L:L,m:m,mode:mode,qs:qs,i:0,res:[],tries:0,spoken:false,showHint:false,locked:false,picked:[],typed:'',built:[]}; go('quiz'); }

/* ---------- affichage du modèle ---------- */
function qBody(q, ctx){
  var h='<p class="prompt">'+esc(q.prompt)+'</p>';
  if(q.model) h+='<div class="model"><small>Modèle</small><br>'+esc(q.model.replace(/^Exemple : /,''))+'</div>';
  if(q.story) h+='<div class="story">'+esc(q.story)+'</div>';
  if(q.img) h+='<div class="qimg">'+img(q.img)+'</div>';
  if(q.text) h+='<div class="qtext'+(q.big?' big':'')+(q.sent?' sent':'')+'">'+esc(q.text)+(q.say&&q.quiet?' <button class="say" style="font-size:15px;padding:5px 11px;vertical-align:middle" onclick="ET.sayText(\''+ctx+'\')" aria-label="Écouter">🔊</button>':'')+'</div>';
  if(q.say&&!q.quiet) h+=sayBtns(q);
  return h; }
function typeHTML(q,ctx,val,done){ var long=q.sent;
  return '<div class="typein'+(long?' long':'')+'">'+(long?'<textarea':'<input type="text"')+' id="'+(ctx==='q'?'typein':'ty_'+ctx)+'" autocomplete="off" autocapitalize="'+(long?'sentences':'off')+'" spellcheck="false" '+(long?'rows="2" placeholder="Écris la phrase complète"':'value="'+esc(val||'')+'"')+' '+(done?'disabled':'')+' onkeydown="if(event.key===\'Enter\'){event.preventDefault();ET.submitType(\''+ctx+'\')}" aria-label="Ta réponse">'+(long?esc(val||'')+'</textarea>':'')+'<button class="btn primary" '+(done?'disabled':'')+' onclick="ET.submitType(\''+ctx+'\')">OK</button></div>'; }

/* END WRITE */
/* ---------- actions ---------- */
function curQ(ctx){ if(ctx==='q') return quiz.qs[quiz.i]; return quiz.qs[+ctx.slice(1)]; }
window.ET={

  submitOrder:function(ctx){ var q=curQ(ctx), b=ctx==='q'?quiz.built:quiz.fix[+ctx.slice(1)].built, s=b.map(function(i){return q.shuf[i];}).join(' ');

  delProf:function(){ if(!confirm('Supprimer le profil de '+P().name+' ?')) return; store.profiles=store.profiles.filter(function(x){return x.id!==store.current;}); store.current=null; save(); gateOK=false; go('profiles'); },
  exportData:function(){ var s=JSON.stringify(store), name='cosmohola-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
    if(window.Android&&Android.saveFile){ try{ Android.saveFile(name,s,'application/json'); toast('Sauvegarde enregistrée dans Téléchargements.'); return; }catch(e){} }

        if(navigator.canShare({files:[shared]})){ navigator.share({files:[shared],title:'Sauvegarde CosmoHola'}).catch(function(e){if(e.name!=='AbortError') toast('Partage impossible. Réessaie avec le téléchargement.');}); return; }

    }

  importData:function(file){ if(!file) return; var r=new FileReader(); r.onload=function(){ try{ var o=JSON.parse(r.result); if(!o||!Array.isArray(o.profiles)||!o.profiles.every(function(p){return p&&typeof p.id==='string'&&typeof p.name==='string';})) throw 0;
